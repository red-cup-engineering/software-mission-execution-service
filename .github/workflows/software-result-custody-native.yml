name: Original software-mission result custody receiving
on:
  pull_request:
    paths:
      - 'src/actor.mjs'
      - 'src/client.mjs'
      - 'src/result-custody.mjs'
      - 'src/semantic-content.mjs'
      - 'test/result-custody.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/software-result-custody-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/result-custody.mjs'
      - 'src/actor.mjs'
      - 'test/result-custody.test.mjs'
      - '.github/workflows/software-result-custody-native.yml'
permissions:
  contents: read
jobs:
  source-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Source syntax is intact
        run: |
          node --check src/actor.mjs
          node --check src/client.mjs
          node --check src/result-custody.mjs
          node --check test/result-custody.test.mjs
  actual-original-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Resolve exact declared package closure and test native journal
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/
          node --test test/result-custody.test.mjs
          npm run verify
      - name: Diagnose original manifest, stale lock and published workspace dependencies
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const declared=pkg.dependencies??{},selected=lock.packages?.['']?.dependencies??{};
          const mismatches=Object.entries(declared)
            .filter(([name,version])=>selected[name]!==version)
            .map(([name,declared])=>({name,declared,locked:selected[name]??null}));
          process.stdout.write(JSON.stringify({
            kind:'original-mission-source-lock-readout',
            manifestVersion:pkg.version,lockVersion:lock.version,
            directDependencyMismatches:mismatches,
          })+'\n');
          for(const [name,version] of Object.entries(declared)) {
            try {
              const raw=execFileSync('npm',['view',name+'@'+version,'dependencies',
                '--json','--registry=https://registry.561.group/'],
                {encoding:'utf8',timeout:8000,stdio:['ignore','pipe','ignore']});
              const deps=JSON.parse(raw.trim()||'{}');
              const unpublished=Object.entries(deps??{})
                .filter(([,value])=>typeof value==='string'&&value.startsWith('workspace:'));
              if(unpublished.length) process.stdout.write(JSON.stringify({
                package:name,version,unpublishedWorkspaceDependencies:unpublished,
              })+'\n');
            } catch {
              process.stdout.write(JSON.stringify({
                package:name,version,registryMetadata:'unavailable',
              })+'\n');
            }
          }
          NODE
